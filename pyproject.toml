[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oee-analytics"
version = "0.1.0"
description = "Compute OEE, downtime Paretos and shift comparisons from manufacturing event logs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
oee = "oee_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oee_analytics = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
